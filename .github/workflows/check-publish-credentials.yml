name: Check publish credentials

# Reports which publishing secrets are configured, by name, without ever
# printing their values. Run this when a release fails to authenticate.
on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report which secrets are set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_ACCESS_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}
          NPM_PUBLISH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
          NPMJS_TOKEN: ${{ secrets.NPMJS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
          NPM_TOKEN_PUBLISH: ${{ secrets.NPM_TOKEN_PUBLISH }}
        run: |
          for name in NPM_TOKEN NPM_ACCESS_TOKEN NPM_AUTH_TOKEN NPM_PUBLISH_TOKEN NPMJS_TOKEN NODE_AUTH_TOKEN NPM_TOKEN_PUBLISH; do
            if [ -n "${!name}" ]; then echo "SECRET $name: configured"; else echo "SECRET $name: absent"; fi
          done

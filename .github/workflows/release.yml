name: Release

on:
  push:
    tags: ['v*']
  # A tag is the usual trigger. This one is here for environments that cannot
  # push tags, and for re-running a release that failed after the tag landed.
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and check everything, but stop short of publishing
        type: boolean
        default: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/smoke.mjs
      - run: node scripts/smoke.cjs
      - run: npm publish --provenance --access public
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
